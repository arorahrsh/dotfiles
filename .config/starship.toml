"$schema" = 'https://starship.rs/config-schema.json'

# Adapted from https://starship.rs/presets/tokyo-night.
# Unicode escapes keep this file ASCII; the prompt needs a Nerd Font.
add_newline = false
format = """
$username\
$hostname\
[\u2591\u2592\u2593](#a3aed2)\
$os\
[\ue0b4](fg:#a3aed2 bg:#769ff0)\
$directory\
[\ue0b4](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[\ue0b4](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[\ue0b4 ](fg:#212736)\
$line_break\
$character"""

[username]
show_always = false
format = '[$user]($style) '
style_user = '#a3aed2'
style_root = 'bold #f7768e'

[hostname]
ssh_only = true
format = '[@$hostname]($style) '
style = '#a3aed2'

[os]
disabled = false
format = '[ $symbol ]($style)'
style = 'fg:#090c0c bg:#a3aed2'

[os.symbols]
Macos = "\U000f0035"
Ubuntu = "\U000f0548"
Linux = "\U000f033d"

[directory]
format = '[ $path$read_only ]($style)'
style = 'fg:#e3e5e5 bg:#769ff0'
truncation_length = 3
truncation_symbol = '.../'
truncate_to_repo = false
read_only = ' (read-only)'

[git_branch]
symbol = "\uf418"
format = '[ $symbol $branch ]($style)'
style = 'fg:#769ff0 bg:#394260'

[git_status]
format = '[($all_status$ahead_behind )]($style)'
style = 'fg:#769ff0 bg:#394260'

[nodejs]
symbol = "\ue718"
format = '[ $symbol ($version) ]($style)'
style = 'fg:#769ff0 bg:#212736'

[bun]
symbol = "\ue76f"
format = '[ $symbol ($version) ]($style)'
style = 'fg:#769ff0 bg:#212736'

[rust]
symbol = "\ue7a8"
format = '[ $symbol ($version) ]($style)'
style = 'fg:#769ff0 bg:#212736'

[golang]
symbol = "\ue627"
format = '[ $symbol ($version) ]($style)'
style = 'fg:#769ff0 bg:#212736'

[php]
symbol = "\ue608"
format = '[ $symbol ($version) ]($style)'
style = 'fg:#769ff0 bg:#212736'

[character]
success_symbol = '[>](bold #9ece6a)'
error_symbol = '[>](bold #f7768e)'
vimcmd_symbol = '[<](bold #9ece6a)'
